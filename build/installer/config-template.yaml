# office-agent config — auto-generated by the installer.
# MCP servers auto-connect at `hermes dashboard` startup. No-auth MCPs work
# out of the box; OAuth-gated MCPs (youtube/meta/tiktok/zalo-oa/schedule) are
# enabled with PLACEHOLDER tokens — replace the PLACEHOLDER_* values below with
# real OAuth credentials to use their API calls. SQLite DBs live under
# {{HERMES_HOME}}\data\.

mcp_servers:
  mcp-catalog:
    command: {{INSTALL_DIR}}\mcps\mcp-catalog.exe
    env:
      CATALOG_DB: {{HERMES_HOME}}\data\catalog.db
    enabled: true
  mcp-ledger:
    command: {{INSTALL_DIR}}\mcps\mcp-ledger.exe
    env:
      LEDGER_DB: {{HERMES_HOME}}\data\ledger.db
    enabled: true
  mcp-video-edit:
    command: {{INSTALL_DIR}}\mcps\mcp-video-edit.exe
    env:
      EDIT_WORKSPACE: {{HERMES_HOME}}\work
      EDIT_FFMPEG: {{INSTALL_DIR}}\ffmpeg\ffmpeg.exe
      EDIT_FFPROBE: {{INSTALL_DIR}}\ffmpeg\ffprobe.exe
    enabled: true
  mcp-hr-data:
    command: {{INSTALL_DIR}}\mcps\mcp-hr-data.exe
    env:
      HR_DB: {{HERMES_HOME}}\data\hr.db
    enabled: true
  mcp-trend-research:
    command: {{INSTALL_DIR}}\mcps\mcp-trend-research.exe
    enabled: true
  mcp-cv-screen:
    command: {{VENV_PY}}
    args: ["-m", "mcp_cv_screen.server"]
    env:
      CV_CACHE_DIR: {{HERMES_HOME}}\data\cv_cache
    enabled: true
  # ── OAuth-gated (enabled; fill real secrets below to use API calls) ──
  mcp-schedule:
    command: {{INSTALL_DIR}}\mcps\mcp-schedule.exe
    env:
      CALCOM_API_URL: https://api.cal.com/v1
      CALCOM_API_KEY: PLACEHOLDER_FILL_REAL_KEY
    enabled: true
  mcp-social-youtube:
    command: {{INSTALL_DIR}}\mcps\mcp-social-youtube.exe
    env:
      YOUTUBE_CLIENT_ID: PLACEHOLDER_FILL_REAL_OAUTH
      YOUTUBE_CLIENT_SECRET: PLACEHOLDER_FILL_REAL_OAUTH
      YOUTUBE_REFRESH_TOKEN: PLACEHOLDER_FILL_REAL_OAUTH
    enabled: true
  mcp-social-meta:
    command: {{INSTALL_DIR}}\mcps\mcp-social-meta.exe
    env:
      META_APP_ID: PLACEHOLDER_FILL_REAL_OAUTH
      META_APP_SECRET: PLACEHOLDER_FILL_REAL_OAUTH
      META_PAGE_ACCESS_TOKEN: PLACEHOLDER_FILL_REAL_OAUTH
      META_IG_USER_ID: PLACEHOLDER_FILL_REAL_OAUTH
    enabled: true
  mcp-social-tiktok:
    command: {{INSTALL_DIR}}\mcps\mcp-social-tiktok.exe
    env:
      TIKTOK_CLIENT_KEY: PLACEHOLDER_FILL_REAL_OAUTH
      TIKTOK_CLIENT_SECRET: PLACEHOLDER_FILL_REAL_OAUTH
      TIKTOK_ACCESS_TOKEN: PLACEHOLDER_FILL_REAL_OAUTH
    enabled: true
  mcp-zalo-oa:
    command: {{INSTALL_DIR}}\mcps\mcp-zalo-oa.exe
    env:
      ZALO_OA_API_URL: https://openapi.zalo.me/v2.0/officialaccount
      ZALO_OA_ACCESS_TOKEN: PLACEHOLDER_FILL_REAL_OAUTH
      ZALO_OA_WEBHOOK_SECRET: PLACEHOLDER_FILL_REAL_OAUTH
      ZALO_OA_WEBHOOK_PORT: '8080'
      ZALO_OA_REPLY_MODE: suggest
    enabled: true